name: PyPI
# A vX.Y.Z tag builds the wheel and sdist from the tagged tree and uploads them to PyPI as
# `dine-mcp` with trusted publishing (OIDC through the `pypi` environment; no token is
# stored). Tag pushes upload once the repository variable PYPI_PUBLISH is `true`; until then,
# or to retry, run it by hand on the tag: `gh workflow run pypi.yml --ref vX.Y.Z`. Files that
# are already on PyPI are skipped, so a repeated run is harmless.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.ref_type == 'tag' && (github.event_name == 'workflow_dispatch' || vars.PYPI_PUBLISH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.13.5'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: make check
      - name: Build and exercise the release distributions
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "$TAG" = "v$version" ]
          python3 scripts/embed-build-identity.py "$version" "$SOURCE_REVISION"
          uv build --no-sources
          uv venv "$RUNNER_TEMP/dine-wheel"
          uv pip install --python "$RUNNER_TEMP/dine-wheel/bin/python" "dist/dine_mcp-$version-py3-none-any.whl"
          EXPECTED_VERSION="$version" EXPECTED_SOURCE_REVISION="$SOURCE_REVISION" "$RUNNER_TEMP/dine-wheel/bin/python" -I - <<'PYTHON'
          import os
          from importlib import metadata, resources
          import dine_mcp
          from dine_mcp.identity import BUILD
          assert dine_mcp.__version__ == os.environ["EXPECTED_VERSION"]
          assert (BUILD.service, BUILD.version, BUILD.source_revision) == ("dine", os.environ["EXPECTED_VERSION"], os.environ["EXPECTED_SOURCE_REVISION"])
          assert (resources.files("dine_mcp") / "ui/availability.html").read_bytes()
          files = metadata.distribution("dine-mcp").files
          assert any(str(path).endswith("/licenses/NOTICE") for path in files)
          PYTHON
          DINE_STATE_DIR="$RUNNER_TEMP/dine-wheel-state" "$RUNNER_TEMP/dine-wheel/bin/dine-mcp" status > "$RUNNER_TEMP/dine-status.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["version"] == sys.argv[2]' "$RUNNER_TEMP/dine-status.json" "$version"
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: test
    if: github.ref_type == 'tag' && (github.event_name == 'workflow_dispatch' || vars.PYPI_PUBLISH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.13.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist
      - name: Upload the tested bytes
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*.whl dist/*.tar.gz
      - name: Verify anonymous package hashes before Registry publication
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/verify-pypi.py --version "${TAG#v}"

  registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify the registry publisher
        shell: bash
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error -o "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Prepare the release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          jq --arg version "$version" '.version = $version | .packages[].version = $version' server.json > server-release.json
          mv server-release.json server.json
      - name: Publish the PyPI package to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
