services:
  dine:
    image: ${DINE_IMAGE:-ghcr.io/benjamin-di/dine-mcp-server:0.2.4}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    ports: ["127.0.0.1:8000:8000"]
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set a private bearer of at least 32 characters}
      DINE_STATE_DIR: /state
      DINE_WEBSITE_DISCOVERY: ${DINE_WEBSITE_DISCOVERY:-0}
      DINE_HOST: 0.0.0.0
      DINE_HTTP_ALLOWED_HOSTS: ${DINE_HTTP_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DINE_HTTP_ALLOWED_ORIGINS: ${DINE_HTTP_ALLOWED_ORIGINS:-}
    volumes: [dine-state:/state]
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000]
volumes:
  dine-state:
