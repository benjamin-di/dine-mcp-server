expect = ['23:45|11:45', '00:30|12:30\s*a\.?m\.?', 'Tokyo|Japan|JST|\+09:00']
forbid = ['\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "party-too-small"
prompt = "Check Group Table in Singapore for two tomorrow evening. If two is below its online minimum, tell me the minimum and give me the booking link. Do not change the party size."
