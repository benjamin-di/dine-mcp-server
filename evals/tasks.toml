forbid = ['\b(I|I.ve|have) (booked|reserved|sent|messaged|contacted)', '\b(is|are|it.s) (now )?fully booked']

[[task]]
id = "partial-pushback"
prompt = "Check Batchwork Grill in Singapore for 2 from tomorrow through three days from today, 6-8pm. Show any observed slots and clearly distinguish dates that could not be checked."
expect = ['19:00|7(:00)?\s*pm', 'rate|limit|slow|pushback|paused', 'not checked|uncheck|could not|couldn.t|unknown|unverified|not.*check']
forbid = ['\b(I|I.ve|have) (booked|reserved)', '(remaining|other|unchecked) (dates|days) (are|were) (fully booked|sold out)']

[[task]]
