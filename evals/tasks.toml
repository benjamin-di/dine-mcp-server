# Evaluation tasks over the synthetic world in catalog.py. Each answer is checked by regular
# expressions (case-insensitive): every `expect` must match, no `forbid` may. `held_out = true`
# tasks are never used while tuning descriptions or instructions.
# Times are venue-local. "Booked" claims are always forbidden: dine-mcp never books.

[[task]]
id = "friday-harbour"
prompt = "Can my partner and I get a table at Harbour Grill in Singapore this coming Friday between 7 and 9:30pm?"
expect = ['19:00|7(:00)?\s*pm', '19:30|7:30']
forbid = ['\b(I|I.ve|have) (booked|reserved)', 'booking (is )?confirmed']

[[task]]
id = "friday-harbour-link"
prompt = "Find me a Friday evening slot for 2 at Harbour Grill, Singapore and give me the link to book it."
expect = ['sevenrooms\.com/explore/harbourgrill']
forbid = ['\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "tokyo-weekday"
prompt = "Is there anything at Kinmokusei in Tokyo for 2 people tomorrow evening?"
expect = ['17:30|5:30\s*pm|20:00|8(:00)?\s*pm|no (tables|availability)|not available|closed|weekend|Saturday|Sunday']
forbid = ['\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "london-saturday-lunch"
prompt = "We are 4 for lunch at The Copper Pot in London next Saturday. What times are open?"
expect = ['12:30']
forbid = ['19:45 .*lunch', '\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "contact-only"
prompt = "Check availability at Lantern House in Tanjong Pagar, Singapore for 2 on Thursday at 8pm."
expect = ['\+65 6550 0303|phone|call', 'no online|not (bookable|available) online|contact|directly']
forbid = ['\b(I|I.ve|have) (booked|reserved)', '\b(is|are|it.s) (now )?fully booked']

[[task]]
id = "ambiguous-name"
prompt = "Check Amberley for dinner for two on Saturday."
expect = ['Singapore|Sydney', 'which|clarify|did you mean|two|both|more than one|several']
forbid = ['\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "ambiguous-resolved"
prompt = "Check Amberley in Sydney, Australia for dinner for two on Saturday."
expect = ['Amberley', 'Sydney', '\+61 2 5550 0505']
forbid = ['\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "not-yet-open"
prompt = "Can I get a table for 2 at Kinmokusei in Tokyo exactly 20 days from today in the evening?"
expect = ['not (yet )?open|not been released|isn.t open|opens|release|bookable from|too far']
forbid = ['\b(is|are|it.s) (now )?(fully booked|sold out)', '\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "party-too-large"
prompt = "We are a group of 9. Can we get a table at Harbour Grill in Singapore on Friday evening?"
expect = ['8|eight', 'call|phone|contact|directly|\+65 6550 0101']
forbid = ['\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "unsupported-provider"
prompt = "Is Bistro Verde in Duxton, Singapore free for 2 on Friday at 7:30pm?"
expect = ['opentable', 'link|book (it )?(directly|yourself|there)|check (it )?(directly|yourself)|can.t check|cannot check|couldn.t check|not able to check|can.t read|doesn.t support|not supported']
forbid = ['\b(I|I.ve|have) (booked|reserved)', 'available at 19:30']

[[task]]
id = "blocked-provider"
prompt = "Check Juniper in Raffles Place, Singapore for 2 people on Wednesday evening."
expect = ['(rate|limit|slow|blocked|try again|later|temporar|couldn.t|could not|unable)']
forbid = ['\b(is|are|it.s) (now )?fully booked|\bthere is no availability', '\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "compare-two"
prompt = "Which has a table for 2 earlier on Friday evening, Harbour Grill (Singapore) or Juniper (Singapore)?"
expect = ['Harbour Grill', '19:00|7(:00)?\s*pm']
forbid = ['Juniper .*(18:00|6(:00)?\s*pm)', '\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "sunday-closed"
prompt = "Does The Copper Pot in London have dinner tables for 2 on Sunday evening?"
expect = ['no|not|none|isn.t|aren.t']
forbid = ['13:00 .*(dinner|evening)', '\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "by-link"
prompt = "Here is the booking page: https://www.sevenrooms.com/reservations/harbourgrill . Any table for 2 this Friday after 9pm?"
expect = ['21:00|9(:00)?\s*pm']
forbid = ['\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "week-range"
prompt = "Over the next 7 days, on which evenings can 2 people eat at Harbour Grill in Singapore between 7 and 10pm?"
expect = ['Fri']
forbid = ['\b(I|I.ve|have) (booked|reserved)']

[[task]]
id = "please-book"
prompt = "Book me a table for 2 at Harbour Grill in Singapore on Friday at 7pm."
expect = ['(can.t|cannot|unable to|not able to|don.t) (make|book|complete|place)|book (it )?(yourself|directly|via|through|using)|link']
forbid = ['\b(I|I.ve|have) (booked|reserved)', 'booking (is )?confirmed', 'confirmation number']

