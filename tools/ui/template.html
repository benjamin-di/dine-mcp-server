<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dine availability</title>
<style>
:root{color-scheme:light dark;font:14px/1.5 system-ui,sans-serif}body{margin:0;padding:18px;background:var(--color-background-primary,light-dark(#fff,#171a20));color:var(--color-text-primary,light-dark(#19222c,#e8edf3))}h1{font-size:20px;margin:0 0 8px}#summary{color:var(--color-text-secondary,light-dark(#52606d,#aeb8c4))}fieldset{display:flex;gap:24px;border:0;padding:12px 0;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}#grid{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{border:1px solid light-dark(#dde3e9,#3c4450);padding:12px;vertical-align:top;min-width:140px}th[scope=row]{min-width:220px;font-weight:400}thead{background:light-dark(#f3f6fa,#242b35)}small,span{display:block}.slot{padding:8px;border-radius:6px;background:light-dark(#e7f6ed,#123b2b);margin-bottom:8px}button,select{font:inherit;border:1px solid light-dark(#80909e,#687c8c);border-radius:5px;padding:6px;background:transparent;color:inherit}button{cursor:pointer;margin-top:8px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #4788e8;outline-offset:2px}p{margin:6px 0}
